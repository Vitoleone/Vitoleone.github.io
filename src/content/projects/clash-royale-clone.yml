      en: Units and Combat
      tr: Birimler ve Çatışma
    description:
      en: Units are created by spending energy and automatically move toward the enemy castle, engaging targets they meet along the way.
      tr: Birimler enerji harcanarak oluşturulur ve düşman kalesine doğru otomatik ilerlerken karşılaştıkları hedeflerle çatışır.
  - title:
      en: Match Goal
      tr: Maç Hedefi
    description:
      en: The winner either destroys the opposing castle or has the castle with more health when time expires.
      tr: Süre dolduğunda rakip kaleyi yok eden veya kalesi daha fazla cana sahip olan taraf kazanır.
