title:
  en: Clash Royale Clone
  tr: Clash Royale Klonu
summary:
  en: A real-time strategy game inspired by Clash Royale.
  tr: Clash Royale'den esinlenen gerçek zamanlı bir strateji oyunu.
description:
  en: Players spend energy to create units that advance toward an enemy castle, fight opposing units and attack the castle. Ranged units can attack airborne units, while close-range units cannot.
  tr: Oyuncular enerji harcayarak düşman kalesine ilerleyen, rakip birimlerle savaşan ve kaleye saldıran birimler oluşturur. Menzilli birimler hava birimlerine saldırabilirken yakın menzilli birimler saldıramaz.
role:
