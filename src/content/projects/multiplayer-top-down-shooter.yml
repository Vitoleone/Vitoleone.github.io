title:
  en: Multiplayer Top-Down Shooter
  tr: Çok Oyunculu Üstten Görünümlü Nişancı
summary:
  en: A cooperative shooter with character progression and a multi-phase boss battle.
  tr: Karakter ilerlemesi ve çok aşamalı patron savaşı içeren iş birliğine dayalı bir nişancı oyunu.
description:
  en: Players defeat enemies to gain experience, improve character attributes and abilities, and face a three-phase boss after the timer reaches one minute.
  tr: Oyuncular deneyim kazanmak, karakter özellikleri ile yeteneklerini geliştirmek ve sayaç bir dakikaya ulaştığında üç aşamalı bir patronla karşılaşmak için düşmanları yener.
