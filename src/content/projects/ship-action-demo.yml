  en: An action game with missions, ammunition and an upgrade system.
  tr: Görevler, mühimmat ve geliştirme sistemi içeren bir aksiyon oyunu.
description:
  en: Players complete the objective shown on screen to advance, monitor their ammunition and return to base to improve attack, health or ammunition using gold dropped by defeated enemies.
  tr: Oyuncular ilerlemek için ekrandaki görevi tamamlar, mühimmatlarını takip eder ve yenilen düşmanlardan kazanılan altınla saldırı, can veya mühimmat geliştirmek için üsse döner.
