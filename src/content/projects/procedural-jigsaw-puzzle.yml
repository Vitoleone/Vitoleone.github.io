contributions:
  - title:
      en: Runtime Texture Slicing
      tr: Çalışma Zamanında Görsel Dilimleme
    description:
      en: A custom algorithm dynamically divides a Texture2D into an N by M sprite grid without requiring pre-cut assets.
      tr: Özel bir algoritma, önceden kesilmiş varlıklar gerektirmeden bir Texture2D görselini dinamik olarak N x M sprite ızgarasına böler.
  - title:
      en: Level and Progression Data
      tr: Bölüm ve İlerleme Verileri
    description:
      en: ScriptableObjects manage level images, grid sizes, time limits and video rewards, while PlayerPrefs tracks unlocked levels and progress.
      tr: ScriptableObject'ler bölüm görsellerini, ızgara boyutlarını, süreleri ve video ödüllerini yönetirken PlayerPrefs açılan bölümleri ve ilerlemeyi takip eder.
  - title:
      en: Input, Hints and Feedback
      tr: Girdi, İpucu ve Geri Bildirim
    description:
      en: Swipe interaction, inactivity hints, a music playlist, tension mode, screen shake and particles support the game feel.
      tr: Kaydırma etkileşimi, hareketsizlik ipuçları, müzik listesi, gerilim modu, ekran sarsıntısı ve parçacıklar oyun hissini destekler.
