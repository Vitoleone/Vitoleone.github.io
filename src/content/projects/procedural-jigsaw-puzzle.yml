title:
  en: Procedural Jigsaw Puzzle
  tr: Prosedürel Yapboz
summary:
  en: A modular puzzle game featuring runtime texture slicing and dynamic gameplay mechanics.
  tr: Çalışma zamanında görsel dilimleme ve dinamik oynanış mekanikleri sunan modüler bir bulmaca oyunu.
description:
  en: A modular Unity puzzle game that slices 2D images into interactive grid-based puzzles at runtime, with scalable level management and audiovisual feedback.
  tr: 2D görselleri çalışma zamanında etkileşimli, ızgara tabanlı bulmacalara ayıran; ölçeklenebilir bölüm yönetimi ve görsel-işitsel geri bildirim sunan modüler bir Unity bulmaca oyunu.
role:
